<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- 和風紙質漸層 -->
    <linearGradient id="washiBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdfcf8" />
      <stop offset="100%" stop-color="#f3ede2" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- 1. 滿版圓角和紙底板 (無多餘外圈) -->
  <rect x="2" y="2" width="124" height="124" rx="26" fill="url(#washiBg)" stroke="#dcd3c4" stroke-width="2.5" filter="url(#cardShadow)" />

  <!-- 2. 超大清晰繁體漢字「漫」 (無四周雜亂邊框，視覺焦點突出) -->
  <text x="64" y="93" 
        font-family="'Noto Serif TC', 'Songti TC', 'Source Han Serif TC', 'Yu Mincho', 'Microsoft JhengHei', serif" 
        font-size="84" 
        font-weight="900" 
        fill="#1a1614" 
        text-anchor="middle" 
        letter-spacing="-2">漫</text>

  <!-- 3. 右下角精緻朱印赤紅「譯」標籤 -->
  <rect x="84" y="84" width="34" height="34" rx="7" fill="#b83b32" stroke="#942a22" stroke-width="1" />
  <text x="101" y="108" 
        font-family="'Noto Serif TC', 'Songti TC', 'Microsoft JhengHei', sans-serif" 
        font-size="22" 
        font-weight="bold" 
        fill="#ffffff" 
        text-anchor="middle">譯</text>
</svg>
