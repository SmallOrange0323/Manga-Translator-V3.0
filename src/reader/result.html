<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>漫譯 — 批次翻譯結果</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700;900&family=Noto+Sans+TC:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="result.css">
</head>
<body>
    <div class="paper-texture"></div>

    <header class="result-header">
        <!-- 左側：朱印標誌 + 作品標題 + 語彙庫徽章 -->
        <div class="header-left">
            <div class="seal-stamp">譯</div>
            <div class="title-group">
                <h1 id="manga-title-display" class="manga-title" title="批次翻譯結果">批次翻譯結果</h1>
                <span id="glossary-info-badge" class="glossary-seal" style="display:none;"></span>
            </div>
        </div>

        <!-- 正中央：上一話 / 下一話 導航列 (極簡純粹版) -->
        <div id="chapter-nav-bar" class="chapter-nav-bar">
            <button id="nav-prev-chapter-btn" class="nav-btn" title="切換至上一話">
                <span>‹</span> 上一話
            </button>
            <button id="nav-next-chapter-btn" class="nav-btn" title="切換至下一話">
                下一話 <span>›</span>
                <span id="nav-pretranslate-badge" class="nav-pretranslate-badge" style="display:none; margin-left:4px; font-size:10px; padding:1px 6px; border-radius:10px; background:#4CAF50; color:#fff; font-weight:bold;">⚡已預翻</span>
            </button>
        </div>

        <!-- 右側操作按鈕群組 -->
        <div class="actions">
            <!-- 行動端直覺外露切換電腦版按鈕 -->
            <button id="mobile-toggle-desktop-btn" class="btn-washi" title="切換為電腦版閱讀器" style="display:none;">💻 電腦版</button>

            <!-- 🔤 字型即時切換選單 -->
            <div class="font-family-wrapper" title="切換對白字型風格">
                <select id="font-family-select" class="font-select-washi">
                    <option value="serif">🌸 典雅宋體</option>
                    <option value="maru">🍡 日漫圓體</option>
                    <option value="gensen">🪨 源石黑體</option>
                    <option value="kai">📜 古典楷體</option>
                </select>
            </div>

            <!-- 字體大小即時調節器 -->
            <div class="font-size-stepper" title="調整對白字體大小">
                <button id="font-decrease-btn" class="btn-washi btn-stepper" title="縮小字體">A⁻</button>
                <span id="font-size-indicator" class="font-size-text">100%</span>
                <button id="font-increase-btn" class="btn-washi btn-stepper" title="放大字體">A⁺</button>
            </div>

            <button id="retranslate-all-btn" class="btn-washi btn-vermilion" title="重新翻譯整本漫畫的所有頁面">
                <span>🔄</span> 重新翻譯全漫畫
            </button>

            <div class="dropdown" style="position:relative;">
                <button id="retranslate-batch-dropdown-btn" class="btn-washi" title="選取特定的批次進行獨立重新翻譯">
                    <span>📦</span> 批次選單 ▾
                </button>
                <div id="batch-dropdown-menu" class="dropdown-menu" style="display:none;">
                </div>
            </div>

            <div class="dropdown" style="position:relative;">
                <button id="more-actions-btn" class="btn-washi btn-icon" title="更多功能">
                    <span>⋯</span>
                </button>
                <div id="more-actions-menu" class="dropdown-menu" style="display:none;">
                    <button id="export-html-btn" class="dropdown-item">🌐 儲存單檔 HTML</button>
                    <button id="export-pdf-btn" class="dropdown-item">📄 儲存為 PDF 書冊</button>
                    <button id="export-txt-btn" class="dropdown-item">📝 匯出純文字劇本</button>
                    <div style="height:1px; background:var(--border-paper); margin:4px 0;"></div>
                    <button id="toggle-mode-btn" class="dropdown-item">📱 切換閱讀器模式</button>
                </div>
            </div>
        </div>
    </header>

    <div id="loading-overlay" class="loading-overlay">
        <div id="main-loading-anim-container" class="loading-anim-container">
            <img id="main-loading-anim" class="loading-anim-small" src="" alt="少女祈禱中">
        </div>
        <div id="loading-text">翻譯中… <span id="progress-text">0 / 0</span></div>
        <button id="btn-stop-translation" style="margin-left: 8px; padding: 6px 14px; font-size: 13px; font-weight: bold; border-radius: 20px; border: none; background: #ef4444; color: #fff; cursor: pointer; box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);">中止</button>
    </div>

    <main id="results-container" class="results-container"></main>

    <!-- 整批重試按鈕（翻譯完成後有失敗圖片才顯示） -->
    <div id="retry-all-container" style="display:none; justify-content:center; padding: 12px 0 4px;">
        <button id="btn-retry-all-failed" style="
            display: flex; align-items: center; gap: 8px;
            padding: 10px 22px; border-radius: 24px; border: none;
            background: linear-gradient(135deg, #f97316, #ef4444);
            color: #fff; font-size: 14px; font-weight: 700;
            cursor: pointer; box-shadow: 0 4px 14px rgba(249,115,22,0.4);
            transition: transform 0.15s, box-shadow 0.15s;
        ">
            🔁 重試所有失敗圖片（<span id="retry-failed-count">0</span> 張）
        </button>
    </div>

    <nav id="nav-footer" class="nav-footer" style="display:none;">
        <button id="prev-btn" class="nav-btn nav-btn--prev">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
            </svg>
            上一話
        </button>
        <button id="next-btn" class="nav-btn nav-btn--next">
            下一話
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/>
            </svg>
        </button>
    </nav>

    <!-- 快速語彙編輯 Modal -->
    <div id="mt-glossary-modal" class="mt-modal">
        <div class="mt-modal-backdrop"></div>
        <div class="mt-modal-content">
            <div class="mt-modal-header">
                <h3 id="mt-glossary-modal-title">📖 作品專屬語彙庫</h3>
                <button class="mt-modal-close">&times;</button>
            </div>
            <div class="mt-modal-body">
                <div class="mt-input-group">
                    <label>原文 (日文)</label>
                    <input type="text" id="mt-glossary-ori" placeholder="例如：ゼイク">
                </div>
                <div class="mt-input-group">
                    <label>譯文 (中文)</label>
                    <input type="text" id="mt-glossary-trans" placeholder="例如：傑伊克">
                </div>
                <p class="mt-modal-hint">💡 提示：若原文已存在，儲存時將自動覆蓋更新為您自訂的譯名。</p>

                <!-- 已收錄詞彙清單管理區 -->
                <div class="mt-glossary-terms-section">
                    <div class="mt-glossary-terms-header">
                        <span class="mt-glossary-terms-title">📚 當前作品收錄詞彙</span>
                        <span id="mt-glossary-terms-count" class="mt-glossary-terms-count">0 詞</span>
                    </div>
                    <div id="mt-glossary-terms-list" class="mt-glossary-terms-list">
                        <!-- 動態插入已收錄的詞彙項目 -->
                    </div>
                </div>
            </div>
            <div class="mt-modal-footer">
                <button id="mt-glossary-cancel" class="mt-btn-secondary">關閉</button>
                <button id="mt-glossary-save" class="mt-btn-accent">儲存條目</button>
            </div>
        </div>
    </div>

    <!-- 行動端全域底部翻譯抽屜 (Bottom Sheet Drawer) -->
    <div id="mt-mobile-drawer" class="mt-mobile-drawer">
        <div class="mt-drawer-backdrop"></div>
        <div class="mt-drawer-content">
            <div class="mt-drawer-header">
                <div class="mt-drawer-handle"></div>
                <div class="mt-drawer-title-row">
                    <span id="mt-drawer-title" class="mt-drawer-title">📄 P.1 翻譯內容</span>
                    <button id="mt-drawer-close" class="mt-drawer-close-btn">✕ 收起</button>
                </div>
            </div>
            <div id="mt-drawer-body" class="mt-drawer-body">
                <!-- 動態注入當前可見卡片的對白清單 -->
            </div>
        </div>
    </div>

    <script type="module" src="./result.js"></script>
</body>
</html>
